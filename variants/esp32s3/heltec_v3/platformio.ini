[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3

; Traditional Chinese display. Kept as a separate env so the stock English build
; stays untouched.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${esp32s3_base.lib_deps} (which would drag oled_std in alongside it).
[env:heltec-v3_zhtw]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = extra
board_check = true
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  ; Bitmap font rather than a rasterised outline one. At 10px an outline font's strokes
  ; land on fractional pixels and can only be forced through a binarisation threshold,
  ; which smears the denser characters and merges neighbouring strokes.
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  ; That font carries no emoji glyphs, so emoji come from the emote table instead. The
  ; 10x10 table is the one to use here: the node list advances by FONT_HEIGHT_SMALL - 3,
  ; about 10px on this 128x64 display, and a 16x16 glyph would bleed into the next row.
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  # From arduino_base (replaces oled_std with oled_cjk above)
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  # From esp32_common
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/dbinfrago/libpax/archive/17302340f100efbc4bee5022ecc72047d6d93ed4.zip
  lewisxhe/XPowersLib@0.3.3
  rweather/Crypto@0.4.0
  # From esp32s3_base
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
