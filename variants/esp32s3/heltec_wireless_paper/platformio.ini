; Using the original screen class
[env:heltec-wireless-paper]
custom_meshtastic_hw_model = 49
custom_meshtastic_hw_model_slug = HELTEC_WIRELESS_PAPER
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Wireless Paper
custom_meshtastic_images = heltec-wireless-paper.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
custom_meshtastic_has_ink_hud = true

extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags} 
  -I variants/esp32s3/heltec_wireless_paper
  -D HELTEC_WIRELESS_PAPER 
  -D GXEPD2_DRIVER_0=GxEPD2_213_FC1
  -D GXEPD2_DRIVER_1=GxEPD2_213_E0213A367
  -D EINK_WIDTH=250
  -D EINK_HEIGHT=122
  -D USE_EINK
  -D USE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -D EINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted
  -D EINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.
  -D EINK_HASQUIRK_GHOSTING             ; Display model is identified as "prone to ghosting"
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
upload_speed = 115200

; Traditional Chinese display for the Heltec Wireless Paper (V1.1 and later, the board
; whose panel model is detected at runtime; V1.0 has its own variant directory).
; Display only: BUTTON_PIN is the board's entire input, so none of the sources that set
; osk_found apply and there is no on-screen keyboard for an IME to sit behind.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${esp32s3_base.lib_deps} (which would drag oled_std in alongside it).
[env:heltec-wireless-paper_zhtw]
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = extra
board_build.partitions = default_8MB.csv
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/heltec_wireless_paper
  -D HELTEC_WIRELESS_PAPER
  -D GXEPD2_DRIVER_0=GxEPD2_213_FC1
  -D GXEPD2_DRIVER_1=GxEPD2_213_E0213A367
  -D EINK_WIDTH=250
  -D EINK_HEIGHT=122
  -D USE_EINK
  -D USE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -D EINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted
  -D EINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.
  -D EINK_HASQUIRK_GHOSTING             ; Display model is identified as "prone to ghosting"
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  -DOLED_CJK=1
  ; USE_EINK puts this board in the large-font group in ScreenFonts.h, so FONT_SMALL is
  ; ArialMT_Plain_16 and a text row is 19px. A 10x10 glyph beside that is barely half the
  ; height of the Latin text sharing the line, which is why the cell size here is 16.
  -DOLED_CJK_SIZE=16
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_16x16.h\"
  ; The font holds only the BMP emoji, so the rest come from the emote table. 16x16 is the
  ; table to pair with this font: the node list advances by FONT_HEIGHT_SMALL - 3, which is
  ; 16px here, so a 16x16 glyph fills the row without reaching into the next one.
  -DEMOTES_TW_16X16
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  # From arduino_base (replaces oled_std with oled_cjk above)
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  # From esp32_common
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/dbinfrago/libpax/archive/17302340f100efbc4bee5022ecc72047d6d93ed4.zip
  lewisxhe/XPowersLib@0.3.3
  rweather/Crypto@0.4.0
  # From esp32s3_base
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
  # The E-Ink driver, from the stock heltec-wireless-paper env
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
upload_speed = 115200

[env:heltec-wireless-paper-inkhud]
extends = esp32s3_base, inkhud
board = heltec_wifi_lora_32_V3
board_build.partitions = default_8MB.csv
build_src_filter =
  ${esp32s3_base.build_src_filter}
  ${inkhud.build_src_filter}
build_flags =
  ${esp32s3_base.build_flags}
  ${inkhud.build_flags}
  -I variants/esp32s3/heltec_wireless_paper
  -D HELTEC_WIRELESS_PAPER
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${esp32s3_base.lib_deps}
upload_speed = 921600
