; M5stack Cardputer Advanced
[env:m5stack-cardputer-adv]
extends = esp32s3_base
board = m5stack-stamps3
board_check = true
board_build.partitions = default_8MB.csv
upload_protocol = esptool
build_flags = 
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  # renovate: datasource=github-tags depName=pschatzmann_arduino-audio-driver packageName=pschatzmann/arduino-audio-driver
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
  # renovate: datasource=git-refs depName=ESP8266Audio packageName=https://github.com/meshtastic/ESP8266Audio gitBranch=meshtastic-2.0.0-dacfix
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  # renovate: datasource=custom.pio depName=ESP8266SAM packageName=earlephilhower/library/ESP8266SAM
  earlephilhower/ESP8266SAM@1.1.0

; Traditional Chinese display plus the Bopomofo IME on the physical keyboard. Kept as
; a separate env so the stock English build keeps the default 8MB partition table and
; stays OTA-capable.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${esp32s3_base.lib_deps} (which would drag oled_std in alongside it).
[env:m5stack-cardputer-adv_zhtw]
extends = esp32s3_base
board = m5stack-stamps3
board_level = extra
board_check = true
; The full zhuyin dictionary is ~2.5 MB of rodata, which overflows the 3.34 MB app
; slot in default_8MB.csv. This table trades the OTA slot for a 6 MB app partition.
board_build.partitions = variants/esp32s3/m5stack_cardputer_adv/partition_6MB_app.csv
upload_protocol = esptool
build_flags =
  ${esp32s3_base.build_flags}
  -D M5STACK_CARDPUTER_ADV
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/m5stack_cardputer_adv
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=16
  ; Carries the 37 Bopomofo symbols and the four tone marks, needed by the IME's
  ; composition row, plus the 22 BMP emoji as ordinary glyphs.
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_16x16.h\"
  ; Emoji that are common in Taiwanese node names, drawn from GNU Unifont's 16x16
  ; bitmaps. Covers the ones outside the BMP, which a FontUTF8 table cannot hold.
  -DEMOTES_TW_16X16
  -DBOPOMOFO_IME
  ; -DBOPOMOFO_LAYOUT_DAQIAN
  -DBOPOMOFO_LAYOUT_YITIAN
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  # From arduino_base (replaces oled_std with oled_cjk above)
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  # From esp32_common
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  ${radiolib_base.lib_deps}
  https://github.com/meshtastic/esp32_https_server/archive/0c71f380390ad483ff134ad938e07f6cf1226c5b.zip
  h2zero/NimBLE-Arduino@1.4.3
  https://github.com/dbinfrago/libpax/archive/17302340f100efbc4bee5022ecc72047d6d93ed4.zip
  lewisxhe/XPowersLib@0.3.3
  rweather/Crypto@0.4.0
  # From esp32s3_base
  https://github.com/meshtastic/ESP32_Codec2/archive/633326c78ac251c059ab3a8c430fcdf25b41672f.zip
  # m5stack-cardputer-adv specific
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  https://github.com/pschatzmann/arduino-audio-driver/archive/v0.2.1.zip
  https://github.com/meshtastic/ESP8266Audio/archive/343024632ee78d6216907b2353fc943a62422d80.zip
  earlephilhower/ESP8266SAM@1.1.0
