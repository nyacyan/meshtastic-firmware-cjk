; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:gat562_mesh_trial_tracker]
extends = nrf52840_base
board_level = extra
board = gat562_mesh_trial_tracker
board_check = true
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/gat562_mesh_trial_tracker
  ;-D GAT562_MESH_TRIAL_TRACKER
  -D PRIVATE_HW
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/gat562_mesh_trial_tracker>

; GAT562 Family: joystick product without the TCA8418 keypad.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather
; than pulling ${nrf52_base.lib_deps} (which would drag in oled_std). Crypto is
; listed explicitly because it lives in nrf52_base and provides AES.h.
; Trackball repurposes P0.26/28/29/30, so external QSPI flash is disabled here.
[env:gat562_family_zhtw]
extends = nrf52840_base
board_level = extra
board = gat562_mesh_trial_tracker
board_check = true
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/gat562_mesh_trial_tracker
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  ; GAT562_MESH_TRIAL_TRACKER stays off: its HardwareModel enum only exists in the
  ; vendor protobufs, not upstream 2.7.23. HW_VENDOR falls back to PRIVATE_HW.
  ;-DGAT562_MESH_TRIAL_TRACKER
  -DGAT562
  -DPRIVATE_HW
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  ; The app partition is fixed at 815104 B and the zhuyin dictionary plus the CJK font
  ; already claim ~170 KB of it, so modules that are dead code on this board or are
  ; opt-in diagnostics get excluded. Each flag below was checked against its gate
  ; points; the ones deliberately left in are documented at the end of the list.
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_POWERMON=1
  ; Drops PowerTelemetryModule (INA219/INA260 multi-channel voltage/current), which no
  ; Pod has populated. The node's own battery broadcast is unaffected: that comes from
  ; DeviceTelemetryModule, which has no exclusion flag, and the on-screen percentage
  ; reads BATTERY_PIN directly. MAX17048Sensor also stays, its file gate is an OR with
  ; MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR, which is not set here.
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  ; Waypoint display needs our own position for the compass and distance fields, and
  ; this board has no GPS, so without a fixed position pushed from the phone the frame
  ; only ever shows "?" for both.
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  ; Neighbour reporting is off by default in NodeDB anyway, and enabling it sets
  ; isPromiscuous, which costs airtime on a shared channel for a topology view this
  ; board has no way to display.
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  ; Deliberately not excluded:
  ;   GPS         - also removes PositionModule, whose handleReceivedProtobuf is the
  ;                 only caller of nodeDB->updatePosition() for remote nodes; peer
  ;                 distance and bearing on screen would go blank.
  ;   TZ          - getTZOffset() returns 0 when excluded, so every displayed time
  ;                 becomes UTC, for 448 B.
  ;   REPLYBOT    - answers /ping with hop count, RSSI and SNR.
  ;   MQTT        - usable over the phone's client proxy on nRF52 (PhoneAPI.cpp).
  ;   TRACEROUTE  - hop recording lives in the module, so excluding it makes this node
  ;                 an unknown hop in other people's traceroutes.
  ;   AIR_QUALITY_SENSOR / ENVIRONMENTAL_SENSOR_EXTERNAL - do not compile in 2.7.23,
  ;                 EnvironmentTelemetry.cpp still references the gated sensor classes.
  ;   STOREFORWARD / WEBSERVER / WIFI / SOCKETAPI - save nothing here, nrf52.ini's
  ;                 build_src_filter already drops mesh/wifi, mesh/api, mesh/http and
  ;                 mesh/eth, and StoreForward is only instantiated on ESP32.
  -DGAT562_DISABLE_EXTERNAL_FLASH=1
  -DHAS_BUTTON=1
  -DBUTTON_PIN=PIN_BUTTON1
  -DHAS_TRACKBALL=1
  -DTB_UP=28
  -DTB_DOWN=4
  -DTB_LEFT=30
  -DTB_RIGHT=31
  -DTB_PRESS=26
  -DTB_DIRECTION=FALLING
  -DDEBUG_MUTE
  -DPIN_BUZZER=33
  -DNEOPIXEL_STATUS_NOTIFICATION_PIN=29
  -DNEOPIXEL_STATUS_NOTIFICATION_COLOR=0xFFFFFF
  -DHAS_SENSOR=1
  -DUSERPREFS_CONFIG_ENVIRONMENT_MEASUREMENT_ENABLED=1
  -DUSERPREFS_CONFIG_ENV_SCREEN_SCREEN_ENABLED=1
  -DUSERPREFS_CONFIG_ENV_TELEM_UPDATE_INTERVAL=3600
  -DENVIRONMENTAL_TELEMETRY_MODULE_ENABLE=1
  -DCJK_IME_ZHUYIN            ; select the Bopomofo/zhuyin candidate backend
  -DZHUYIN_SINGLE_CHAR        ; single-char dictionary; full trie overflows 1 MB flash
  -DBOPOMOFO_LAYOUT_DAQIAN    ; on-screen key layout (Dachen)
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  ; Traditional Chinese table carrying the 37 Bopomofo symbols and the four tone
  ; marks, which the IME's composition row needs.
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  ; Emoji that are common in Taiwanese node names. There is no off-the-shelf bitmap
  ; font at 10px, so the glyphs are hand drawn.
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/gat562_mesh_trial_tracker>
; Sensor deps are the curated GAT562 Family set (BMP280/BME280/INA2xx/AHT/SHT/
; MAX1704x), not the full ${environmental_*} lists. The full lists drag in BSEC2
; and every driver, adding ~100 KB of flash that this board never uses.
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  rweather/Crypto@0.4.0
  https://github.com/adafruit/Adafruit_NeoPixel/archive/1.15.5.zip
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  https://github.com/adafruit/Adafruit_Sensor/archive/refs/tags/1.1.15.zip
  https://github.com/adafruit/Adafruit_BMP280_Library/archive/refs/tags/3.0.0.zip
  https://github.com/adafruit/Adafruit-BMP085-Library/archive/refs/tags/1.2.4.zip
  https://github.com/adafruit/Adafruit_BME280_Library/archive/refs/tags/2.3.0.zip
  https://github.com/adafruit/Adafruit_INA260/archive/refs/tags/1.5.3.zip
  https://github.com/adafruit/Adafruit_INA219/archive/refs/tags/1.2.3.zip
  https://github.com/adafruit/Adafruit_AHTX0/archive/refs/tags/2.0.6.zip
  https://github.com/Sensirion/arduino-sht/archive/refs/tags/v1.2.6.zip
  https://github.com/adafruit/Adafruit_MAX1704X/archive/refs/tags/1.0.3.zip
