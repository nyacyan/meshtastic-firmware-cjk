; Promicro + E22(0)-xxxM / HT-RA62 modules board variant - DIY - with TCXO
[env:nrf52_promicro_diy_tcxo]
custom_meshtastic_hw_model = 63
custom_meshtastic_hw_model_slug = NRF52_PROMICRO_DIY
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = NRF52 Pro-micro DIY
custom_meshtastic_images = promicro.svg
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink

; NRF52 ProMicro w/ E-Ink display
[env:nrf52_promicro_diy-inkhud]
board_level = extra
extends = nrf52840_base, inkhud
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -D NRF52_PROMICRO_DIY
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
extra_scripts =
  ${nrf52840_base.extra_scripts}
  variants/nrf52840/diy/nrf52_promicro_diy_tcxo/custom_build_tasks.py ; Add to PIO's Project Tasks pane: preset builds for common displays

; NRF52 ProMicro DIY carrying Traditional Chinese on the I2C display. Kept as a separate
; env so the stock English build stays untouched.
; Display only, no Bopomofo IME: variant.h exposes a single button (P1.00) and no
; trackball, joystick or keypad, and the on-screen keyboard is only reachable through
; four-direction navigation (VirtualKeyboard::moveCursorUp/Down/Left/Right). An IME
; nothing can drive would only cost flash, so this env has the same shape as
; heltec-v3_zhtw: read Chinese, compose in whatever the phone app sends.
; Deliberately not paired with an InkHUD env either. InkHUD renders through its own
; GFXfont tables in src/graphics/niche/Fonts (FreeSans*_Win125x, single-byte codepages)
; and never touches OLEDDisplay, so OLED_CJK does not reach it.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${nrf52840_base.lib_deps} (which would drag oled_std in alongside it). Crypto
; is listed explicitly because it lives in nrf52_base and provides AES.h. The full
; environmental sensor set is kept: the I2C header is exposed for the builder's own
; peripherals, so any of those drivers may be in use.
[env:nrf52_promicro_diy_tcxo_zhtw]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  -D NRF52_PROMICRO_DIY
  ; The font costs 76407 B of the fixed 815104 B app partition (66209 B of glyph data
  ; plus a 10186 B codepoint index), and the stock build already sits at 94.2%
  ; (767432 B), so the CJK link overflows by 30688 B. Muting the serial log is what buys
  ; it back, and it is enough on its own: this env links at 750376 B (92.1%), in fact
  ; below the stock build, because the muted log saves more than the font and the CJK
  ; glyph tables add. So no module had to be given up, which matters on a DIY board
  ; where the builder may have wired anything to the I2C header. The cost is that a node
  ; flashed with this env logs nothing over USB; build the stock env when you need the
  ; log to bring a new one up.
  -DDEBUG_MUTE
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  ; Bitmap font rather than a rasterised outline one. At 10px an outline font's strokes
  ; land on fractional pixels and can only be forced through a binarisation threshold,
  ; which smears the denser characters and merges neighbouring strokes.
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  ; That font carries no emoji glyphs, so emoji come from the emote table instead. The
  ; 10x10 table is the one to use here: the I2C header takes the usual 128x64 SSD1306,
  ; where the node list advances by FONT_HEIGHT_SMALL - 3 (about 10px) and a 16x16 glyph
  ; would bleed into the next row.
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip

; NRF52 ProMicro DIY with the Bopomofo IME on the on-screen keyboard, for builders who
; have wired navigation hardware. Kept apart from nrf52_promicro_diy_tcxo_zhtw because
; the IME costs 81104 B and that env has only 64728 B free - it overflows by 16376 B,
; measured. Something has to go, and there are two currencies to pay in:
;   sensor drivers - swap the full ${environmental_*} lists (50 packages) for a curated
;     set, the way GAT562 does. Worth 103456 B, and needs only two module exclusions.
;   feature modules - keep every sensor package and exclude eight modules instead. Worth
;     45528 B, which lands this env at 787552 B, 96.6% of the partition.
; This board's exposed I2C header is the whole point of it, so the sensor packages stay
; and the modules go: the second option. That keeps EnvironmentTelemetry's long tail
; alive - BME68x/BSEC2 air quality, SCD30/SCD4x CO2, BMP3XX, DPS310, LPS2X, MCP9808,
; PCT2075 and the TSL/VEML/LTR/BH1750 light sensors are all still drivable here, and
; none of them would be under the curated list.
; The eight exclusions are listed with their reasoning below. Note that three of them do
; bite into sensing even though the drivers remain linkable: motion and magnetometer
; support are gone entirely, and so is INA2xx multi-channel power monitoring.
; Headroom is 27552 B, or 3.4%. That is thin enough that an upstream merge which grows
; the firmware can push this env over on its own, so check it after every rebase - it is
; the first target here that will break.
[env:nrf52_promicro_diy_tcxo_ime_zhtw]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -I variants/fonts
  -D NRF52_PROMICRO_DIY
  ; Same reason as the display-only env: the glyph tables do not fit against a logging
  ; build. See that env for the arithmetic.
  -DDEBUG_MUTE
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
  ; The IME itself: 81104 B, of which 72452 B is the dictionary (28431 B of trie index
  ; over 5548 nodes, plus a 44021 B candidate blob) and 8652 B is code.
  -DCJK_IME_ZHUYIN            ; select the Bopomofo/zhuyin candidate backend
  -DZHUYIN_SINGLE_CHAR        ; single-char dictionary; the full phrase trie is 8x the
                              ; data and does not fit in 1 MB, let alone this partition
  -DBOPOMOFO_LAYOUT_DAQIAN    ; on-screen key layout (Dachen)
  ; No Tab key on this board, so the user button hops between the keyboard's columns.
  ; Opted into explicitly: the macro defaults to GAT562 only, see VirtualKeyboard.h.
  -DVK_JOYSTICK_ONLY=1
  ; Navigation hardware. variant.h documents exactly four free pins - P1.01, P1.02,
  ; P1.06 and P1.07 - and a 4-way switch or a trackball's quadrature outputs take all
  ; four, so there is nothing left for a centre/press pin. TB_PRESS stays at its
  ; configuration.h default of 255, which TrackballInterruptBase::init reads as "not
  ; wired" and skips. Select comes from the user button instead: with a screen attached
  ; InputBroker gives BUTTON_PIN singlePress = INPUT_BROKER_USER_PRESS (hop to the next
  ; key) and longPress = INPUT_BROKER_SELECT at 500 ms (type it), so the board can both
  ; navigate and commit without a fifth pin.
  ; If you would rather click to type than hold, move TB_RIGHT's pin to TB_PRESS: the
  ; hop on the user button then stands in for the missing right direction.
  -DHAS_TRACKBALL=1
  -DTB_UP=33                  ; P1.01
  -DTB_DOWN=34                ; P1.02
  -DTB_LEFT=38                ; P1.06
  -DTB_RIGHT=39               ; P1.07
  -DTB_DIRECTION=FALLING      ; pins are INPUT_PULLUP, so a closure pulls them low
  ; The eight exclusions that pay for the IME, worth 45528 B measured. Grouped by how
  ; much they actually cost this board.
  ; Dead weight here either way:
  -DMESHTASTIC_EXCLUDE_ATAK=1            ; ATAK plugin, no use on a Bopomofo node
  -DMESHTASTIC_EXCLUDE_RANGETEST=1       ; opt-in diagnostic, and it writes to the FS
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1    ; off by default in NodeDB, and enabling it sets
                                         ; isPromiscuous, which costs shared airtime for
                                         ; a topology view a 128x64 panel cannot show
  -DMESHTASTIC_EXCLUDE_SERIAL=1          ; UART bridge to an external MCU; the two free
                                         ; Serial2 pins are the GPS's on this variant
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1 ; a detection node and a hand-typed messaging
                                         ; node are different deployments
  ; These three do cost sensing. The drivers stay linkable through the lists below, but
  ; nothing instantiates them any more:
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1   ; no motion sensor on the board as shipped
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1    ; ditto, and there is no compass frame without it
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1 ; drops INA219/INA260 multi-channel monitoring.
                                         ; The node's own battery broadcast is unaffected:
                                         ; that is DeviceTelemetryModule, which has no
                                         ; exclusion flag, and the on-screen percentage
                                         ; reads BATTERY_PIN (P0.31) directly.
  ; Deliberately kept. WAYPOINT is the one to note, because GAT562 excludes it and this
  ; env does not: that board has no GPS, so its waypoint frames could only ever show "?"
  ; for the compass and distance fields, whereas this variant has GPS_TX/RX/EN and a
  ; builder who wired them gets real values. It was measured before being kept - the
  ; module is 2496 B here, which the partition can carry.
  ; The rest are kept for the same reasons GAT562 documents: GPS/PositionModule (its
  ; handleReceivedProtobuf is the only caller of nodeDB->updatePosition() for remote
  ; nodes, so peer distance and bearing would go blank), TZ (excluding it makes every
  ; displayed time UTC, for 448 B), MQTT (works over the phone's client proxy on nRF52),
  ; TRACEROUTE (hop recording lives in the module, so excluding it makes this node an
  ; unknown hop in other people's traceroutes) and the whole ENVIRONMENTAL_SENSOR path,
  ; which is the entire reason this env pays in modules rather than in drivers.
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink
; Identical to the display-only env: the full sensor lists, deliberately. Keeping these
; is what the eight exclusions above bought.
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip

; NRF52 ProMicro DIY driven by a physical I2C keyboard - an M5Stack CardKB or similar -
; with the Bopomofo IME. This is a different code path from _ime_zhtw, not the same one
; with a keyboard bolted on, which is why it needs its own env:
;   _ime_zhtw defines CJK_IME_ZHUYIN, which puts the candidate machinery inside
;     VirtualKeyboard. That class consumes navigation events only - its handleKeyChar()
;     is a no-op stub (VirtualKeyboard.h:83, "override in subclasses for physical
;     keyboards"), so a physical keyboard's characters are read and then dropped.
;   this env defines BOPOMOFO_IME, which makes OnScreenKeyboardModule instantiate
;     BopomofoInputModule instead (OnScreenKeyboardModule.cpp:39). That subclass is the
;     only handleKeyChar() override in the tree and drives its own composer, so typed
;     letters actually reach the engine.
; The two macros are unrelated - neither implies the other - and defining both is not a
; supported combination, so pick one env per input device.
; No trackball pins here: the CardKB supplies its own arrows (0xb4-0xb7), Enter and ESC
; through kbI2cBase, and cardKbI2cImpl.cpp:74 sets osk_found under BOPOMOFO_IME so the
; canned-message screen opens free-text compose on the first printable key. The keyboard
; is found by I2C probe (ScanI2CTwoWire.cpp:332), so nothing here has to name it.
; Chinese/English toggle is fn+c, added to the CardKB branch of kbI2cBase.cpp for this
; env. Upstream's Ctrl+Space cannot be used: that is generated by CardputerKeyboard.cpp,
; and a CardKB has no Ctrl key.
; Layout is Dachen, which is BpmfComposer.h's default - the flag below only states the
; intent. A physical keyboard uses KEYMAP_DAQIAN; KEYMAP_DAQIAN_SCREEN is the on-screen
; variant and does not apply here.
[env:nrf52_promicro_diy_tcxo_kb_zhtw]
extends = nrf52840_base
board = promicro-nrf52840
board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_tcxo
  -I variants/fonts
  -D NRF52_PROMICRO_DIY
  ; Same reason as the other two CJK envs: the glyph tables do not fit against a logging
  ; build. See the display-only env for the arithmetic.
  -DDEBUG_MUTE
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
  -DBOPOMOFO_IME             ; physical-keyboard IME path, see the note above
  ; Starts in Daqian, and fn+b switches to Eten and back. SWITCHABLE is what links
  ; the second key table in; without it the named layout is the only one built.
  -DBOPOMOFO_LAYOUT_DAQIAN
  -DBOPOMOFO_LAYOUT_SWITCHABLE
  ; Single-char dictionary. The Cardputer omits this flag because an 8 MB ESP32-S3 can
  ; carry the full phrase trie; on this 815104 B partition it cannot. The flag is read in
  ; zhuyin_trie_helpers.h, which both IME paths reach through bpmf_engine.h.
  -DZHUYIN_SINGLE_CHAR
  ; Same eight exclusions as _ime_zhtw and for the same reasons - see that env for the
  ; per-flag reasoning and for why the sensor lists are kept instead.
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_tcxo>
debug_tool = jlink
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
