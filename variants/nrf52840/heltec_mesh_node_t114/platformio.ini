; First prototype nrf52840/sx1262 device
[env:heltec-mesh-node-t114]
custom_meshtastic_hw_model = 69
custom_meshtastic_hw_model_slug = HELTEC_MESH_NODE_T114
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Mesh Node T114
custom_meshtastic_images = heltec-mesh-node-t114.svg, heltec-mesh-node-t114-case.svg
custom_meshtastic_tags = Heltec

extends = nrf52840_base
board = heltec_mesh_node_t114
board_level = pr
debug_tool = jlink

# add -DCFG_SYSVIEW if you want to use the Segger systemview tool for OS profiling.
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/heltec_mesh_node_t114
  -DHELTEC_T114

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_node_t114>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip

; Traditional Chinese display only: the board exposes a single button, so none of the
; four sources that set osk_found apply and there is no way to drive the on-screen
; keyboard. Kept as a separate env so the stock English build stays untouched.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${nrf52840_base.lib_deps} (which would drag in oled_std). Crypto is listed
; explicitly because it lives in nrf52_base and provides AES.h.
[env:heltec-mesh-node-t114_zhtw]
extends = nrf52840_base
board = heltec_mesh_node_t114
board_level = extra
debug_tool = jlink
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/heltec_mesh_node_t114
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  -DHELTEC_T114
  ; The font claims ~174 KB of the fixed 815104 B app partition, which the stock build
  ; has no room for. Muting the serial log is what buys most of it back; the official
  ; release builds run with it too.
  -DDEBUG_MUTE
  ; Modules that are dead weight on this board go as well.
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1  ; no motion sensor on the board
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1   ; likewise, and MagnetometerThread.h instantiates
                                        ; the classes the curated lib list drops
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DOLED_CJK=1
  ; ScreenFonts.h puts USE_ST7789 in the large-font group, so FONT_SMALL is
  ; ArialMT_Plain_16 at 19px per row. A 10x10 Chinese glyph next to that is half the
  ; height of the Latin text, hence 16x16 here.
  -DOLED_CJK_SIZE=16
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_16x16.h\"
  ; That font carries no emoji glyphs, so emoji come from the emote table instead. The
  ; node list advances by FONT_HEIGHT_SMALL - 3, which is 16px here, so the 16x16 table
  ; fits without bleeding into the neighbouring row.
  -DEMOTES_TW_16X16
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_node_t114>
; Sensor deps are a curated set (BMP085/BMP280/BME280/AHTx0/INA219/INA260/MAX1704x)
; rather than the full ${environmental_*} lists, which drag in BSEC2 and every driver for
; about 79 KB of flash this env cannot spare. Every sensor header in the tree is guarded
; by __has_include, so dropping a library drops its sensor rather than breaking the build.
; The accelerometer and magnetometer exclusions above are mandatory alongside this list:
; unlike the sensors, those two threads instantiate their classes unguarded.
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip
  https://github.com/adafruit/Adafruit_NeoPixel/archive/1.15.5.zip
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  https://github.com/adafruit/Adafruit_Sensor/archive/refs/tags/1.1.15.zip
  https://github.com/adafruit/Adafruit_BMP280_Library/archive/refs/tags/3.0.0.zip
  https://github.com/adafruit/Adafruit-BMP085-Library/archive/refs/tags/1.2.4.zip
  https://github.com/adafruit/Adafruit_BME280_Library/archive/refs/tags/2.3.0.zip
  https://github.com/adafruit/Adafruit_INA260/archive/refs/tags/1.5.3.zip
  https://github.com/adafruit/Adafruit_INA219/archive/refs/tags/1.2.3.zip
  https://github.com/adafruit/Adafruit_AHTX0/archive/refs/tags/2.0.6.zip
  https://github.com/adafruit/Adafruit_MAX1704X/archive/refs/tags/1.0.3.zip
