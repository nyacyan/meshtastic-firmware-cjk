[env:seeed_wio_tracker_L1_eink]
custom_meshtastic_hw_model = 100
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L1_EINK
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Wio Tracker L1 E-Ink
custom_meshtastic_images = wio_tracker_l1_eink.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_has_ink_hud = true

board = seeed_wio_tracker_L1
extends = nrf52840_base
;board_level = extra
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_wio_tracker_L1_eink
  -D SEEED_WIO_TRACKER_L1_EINK
  -D SEEED_WIO_TRACKER_L1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DUSE_EINK
  -DEINK_DISPLAY_MODEL=GxEPD2_213_B74
  -DEINK_WIDTH=250
  -DEINK_HEIGHT=122
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DEINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted
  -DEINK_LIMIT_RATE_BACKGROUND_SEC=30  ; Minimum interval between BACKGROUND updates
  -DEINK_LIMIT_RATE_RESPONSIVE_SEC=1   ; Minimum interval between RESPONSIVE updates
;   -D EINK_LIMIT_GHOSTING_PX=2000      ; (Optional) How much image ghosting is tolerated
  -DEINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.
  -DEINK_HASQUIRK_GHOSTING             ; Display model is identified as "prone to ghosting"
  -DEINK_HASQUIRK_WEAKFASTREFRESH      ; Pixels set with fast-refresh are easy to clear, disrupted by sunlight
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1_eink>
lib_deps =
  ${nrf52840_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
debug_tool = jlink

; Traditional Chinese display. Kept as a separate env so the stock English build
; stays untouched.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; inheriting it (which would drag oled_std in alongside it). GxEPD2 has to stay.
[env:seeed_wio_tracker_L1_eink_zhtw]
board = seeed_wio_tracker_L1
board_level = extra
extends = nrf52840_base
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_wio_tracker_L1_eink
  ; Traditional Chinese font lives in variants/fonts so every CJK board shares one copy.
  -I variants/fonts
  -D SEEED_WIO_TRACKER_L1_EINK
  -D SEEED_WIO_TRACKER_L1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DUSE_EINK
  -DEINK_DISPLAY_MODEL=GxEPD2_213_B74
  -DEINK_WIDTH=250
  -DEINK_HEIGHT=122
  -DUSE_EINK_DYNAMICDISPLAY            ; Enable Dynamic EInk
  -DEINK_LIMIT_FASTREFRESH=10          ; How many consecutive fast-refreshes are permitted
  -DEINK_LIMIT_RATE_BACKGROUND_SEC=30  ; Minimum interval between BACKGROUND updates
  -DEINK_LIMIT_RATE_RESPONSIVE_SEC=1   ; Minimum interval between RESPONSIVE updates
  -DEINK_BACKGROUND_USES_FAST          ; (Optional) Use FAST refresh for both BACKGROUND and RESPONSIVE, until a limit is reached.
  -DEINK_HASQUIRK_GHOSTING             ; Display model is identified as "prone to ghosting"
  -DEINK_HASQUIRK_WEAKFASTREFRESH      ; Pixels set with fast-refresh are easy to clear, disrupted by sunlight
  ; The font and dictionary claim ~260 KB of the fixed 815104 B app partition, which the
  ; stock build has no room for. Muting the serial log is what buys most of it back; the
  ; official release builds run with it too.
  -DDEBUG_MUTE
  ; Modules that are dead weight on this board.
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1  ; no motion sensor on the board
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1   ; likewise, and MagnetometerThread.h instantiates
                                        ; the classes the curated lib list drops
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_DROPZONE=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_POWERMON=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  ; PIN_SERIAL2_RX/TX are both -1 on this board, so the serial bridge has no port to
  ; work with. The Grove header is I2C.
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  ; POWER_TELEMETRY is deliberately kept: the curated sensor list below still carries the
  ; INA219/INA260 drivers, and excluding the module would leave them with nothing to feed.
  -DOLED_CJK=1
  ; ScreenFonts.h puts USE_EINK in the large-font group, so FONT_SMALL is
  ; ArialMT_Plain_16 at 19px per row. A 10x10 Chinese glyph next to that is half the
  ; height of the Latin text, hence 16x16 here.
  -DOLED_CJK_SIZE=16
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_16x16.h\"
  ; That font carries no emoji glyphs, so emoji come from the emote table instead. The
  ; node list advances by FONT_HEIGHT_SMALL - 3, which is 16px here, so the 16x16 table
  ; fits without bleeding into the neighbouring row.
  -DEMOTES_TW_16X16
  -DCJK_IME_ZHUYIN            ; select the Bopomofo/zhuyin candidate backend
  -DZHUYIN_SINGLE_CHAR        ; single-char dictionary; full trie overflows the partition
  -DBOPOMOFO_LAYOUT_DAQIAN    ; on-screen key layout (Dachen)
  ; The board is driven by a trackball with no Tab key, so the user button has to take
  ; over jumping between the on-screen keyboard's columns. Opted into explicitly: the
  ; macro defaults to GAT562 only, see VirtualKeyboard.h.
  -DVK_JOYSTICK_ONLY=1
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1_eink>
debug_tool = jlink
; Sensor deps are a curated set rather than the full ${environmental_*} lists, which drag
; in BSEC2 and every driver for about 85 KB this env cannot spare once the dictionary is
; in. The cost is real on this board -- the Grove header is I2C, so a driver dropped here
; is a sensor that can no longer be plugged in. What is left covers the common parts
; (BMP085/BMP280/BME280/AHTx0/SHT31/INA219/INA260/MAX1704x); the display-only env next
; door keeps the full set for anyone who needs the rest. Every sensor header in the tree
; is guarded by __has_include, so dropping a library drops its sensor rather than breaking
; the build. The accelerometer and magnetometer exclusions above are mandatory alongside
; this list: unlike the sensors, those two threads instantiate their classes unguarded.
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
  https://github.com/adafruit/Adafruit_Sensor/archive/refs/tags/1.1.15.zip
  # GxEPD2 draws through Adafruit GFX, so this one is not optional here.
  https://github.com/adafruit/Adafruit-GFX-Library/archive/refs/tags/1.12.6.zip
  https://github.com/adafruit/Adafruit_BMP280_Library/archive/refs/tags/3.0.0.zip
  https://github.com/adafruit/Adafruit-BMP085-Library/archive/refs/tags/1.2.4.zip
  https://github.com/adafruit/Adafruit_BME280_Library/archive/refs/tags/2.3.0.zip
  https://github.com/adafruit/Adafruit_INA260/archive/refs/tags/1.5.3.zip
  https://github.com/adafruit/Adafruit_INA219/archive/refs/tags/1.2.3.zip
  https://github.com/adafruit/Adafruit_AHTX0/archive/refs/tags/2.0.6.zip
  https://github.com/adafruit/Adafruit_SHT31/archive/refs/tags/2.2.2.zip
  https://github.com/adafruit/Adafruit_MAX1704X/archive/refs/tags/1.0.3.zip
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
  # renovate: datasource=git-refs depName=meshtastic-GxEPD2 packageName=https://github.com/meshtastic/GxEPD2 gitBranch=master
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip

[env:seeed_wio_tracker_L1_eink-inkhud]
board = seeed_wio_tracker_L1
extends = nrf52840_base, inkhud
build_flags = 
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/seeed_wio_tracker_L1_eink
  -D SEEED_WIO_TRACKER_L1
  -D BUTTON_PIN=D13
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = 
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/seeed_wio_tracker_L1_eink>
lib_deps =
  ${inkhud.lib_deps} ; Before base libs_deps, so we use ZinggJM/GFXRoot instead of AdafruitGFX (saves space)
  ${nrf52840_base.lib_deps}
debug_tool = jlink
