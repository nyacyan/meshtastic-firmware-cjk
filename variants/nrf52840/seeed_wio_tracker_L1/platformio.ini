[env:seeed_wio_tracker_L1]
custom_meshtastic_hw_model = 99
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Wio Tracker L1
custom_meshtastic_images = wio_tracker_l1_case.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true

board = seeed_wio_tracker_L1
extends = nrf52840_base
build_flags = ${nrf52840_base.build_flags} 
  -I variants/nrf52840/seeed_wio_tracker_L1
  -D SEEED_WIO_TRACKER_L1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1>
debug_tool = jlink

; Traditional Chinese display plus the on-screen Bopomofo IME, driven by the
; trackball. Kept as a separate env so the stock English build stays untouched.
; CJK builds swap oled_std -> oled_cjk, so lib_deps is curated by hand rather than
; pulling ${nrf52840_base.lib_deps} (which would drag in oled_std). Crypto is listed
; explicitly because it lives in nrf52_base and provides AES.h.
[env:seeed_wio_tracker_L1_zhtw]
board = seeed_wio_tracker_L1
board_level = extra
extends = nrf52840_base
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_wio_tracker_L1
  -I variants/fonts
  -D SEEED_WIO_TRACKER_L1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  ; The font and dictionary claim ~170 KB of the fixed 815104 B app partition, which
  ; the stock build has no room for. Muting the serial log is what buys it back; the
  ; official release builds run with it too.
  -DDEBUG_MUTE
  ; Muting the log is still ~6.5 KB short, so four modules that are dead weight on
  ; this board go as well. The sensor driver list is deliberately left at the stock
  ; full set: the board has a Grove port, so any of those drivers may be in use.
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1  ; no motion sensor on the board
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DCJK_IME_ZHUYIN            ; select the Bopomofo/zhuyin candidate backend
  -DZHUYIN_SINGLE_CHAR        ; single-char dictionary; full trie overflows the partition
  -DBOPOMOFO_LAYOUT_DAQIAN    ; on-screen key layout (Dachen)
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  ; The board is driven by a joystick with no Tab key, so the user button has to take
  ; over jumping between the on-screen keyboard's columns. Opted into explicitly: the
  ; macro defaults to GAT562 only, see VirtualKeyboard.h.
  -DVK_JOYSTICK_ONLY=1
  ; Emoji that are common in Taiwanese node names. There is no off-the-shelf bitmap
  ; font at 10px, so the glyphs are hand drawn. The stock glyphs are 16x16 and bleed
  ; into the neighbouring row at this 128x64 display's line height, so this 10x10
  ; table also serves to override them.
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1>
debug_tool = jlink
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${radiolib_base.lib_deps}
  rweather/Crypto@0.4.0
  ${environmental_base.lib_deps}
  ${environmental_extra.lib_deps}
  https://github.com/Kongduino/Adafruit_nRFCrypto/archive/8cde7189b5ead9dcd49f72601b43b969c0bbc06e.zip
