; The 1.0 release of the TBEAM board 
[env:tbeam]
custom_meshtastic_hw_model = 4
custom_meshtastic_hw_model_slug = TBEAM
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-Beam
custom_meshtastic_images = tbeam.svg
custom_meshtastic_tags = LilyGo

extends = esp32_base
board = ttgo-tbeam

board_check = true
build_flags = ${esp32_base.build_flags}
  -D TBEAM_V10
  -I variants/esp32/tbeam
upload_speed = 921600

[env:tbeam-displayshield]
extends = env:tbeam
board_level = extra
build_flags =
  ${env:tbeam.build_flags}
  -D USE_ST7796

lib_deps =
  ${env:tbeam.lib_deps}
  # renovate: datasource=github-tags depName=meshtastic-st7796 packageName=meshtastic/st7796
  https://github.com/meshtastic/st7796/archive/1.0.5.zip
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.3.4

[env:tbeam_zhtw]
custom_meshtastic_hw_model = 4
custom_meshtastic_hw_model_slug = TBEAM
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-Beam CJK
custom_meshtastic_images = tbeam.svg
custom_meshtastic_tags = LilyGo

extends = esp32_base
board = ttgo-tbeam
board_level = extra
board_check = true
build_flags =
  ${esp32_base.build_flags}
  -D TBEAM_V10
  -I variants/esp32/tbeam
  -I variants/fonts
  -DOLED_CJK=1
  -DOLED_CJK_SIZE=10
  -DOLED_CJK_CUSTOM=\"traditional_chinese_utf8_10x10.h\"
  -DEMOTES_TW_10X10
  -DOLEDDISPLAY_UTF8_TOP_PADDING=2
upload_speed = 921600
lib_deps =
  ${env.lib_deps}
  ${oled_cjk.lib_deps}
  https://github.com/end2endzone/NonBlockingRTTTL/archive/refs/tags/1.4.0.zip
  ${networking_base.lib_deps}
  ${networking_extra.lib_deps}
  ${environmental_base.lib_deps}
  ${environmental_extra_no_bsec.lib_deps}
  ${radiolib_base.lib_deps}
  h2zero/NimBLE-Arduino@1.4.3
  lewisxhe/XPowersLib@0.3.3
  rweather/Crypto@0.4.0

